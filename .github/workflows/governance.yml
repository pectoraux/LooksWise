name: Governance
on:
  pull_request:
  push:
    branches: [main]

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate machine-readable state
        run: python3 scripts/governance-check.py
      - name: Validate required artifacts
        run: python3 scripts/spec-check.py
